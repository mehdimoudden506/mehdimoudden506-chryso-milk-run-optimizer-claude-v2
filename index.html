<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milk Run Optimizer — Distribution Tour Management</title>

  <!-- Font Awesome 6.4.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Application styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>

  <!-- ===== TOP NAVIGATION ===== -->
  <nav id="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-truck-fast"></i>
      <span>Milk Run Optimizer</span>
    </div>
    <ul class="nav-links" id="nav-links">
      <li><a href="#" class="nav-item active" data-section="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
      <li><a href="#" class="nav-item" data-section="clients"><i class="fa-solid fa-building-user"></i> Clients</a></li>
      <li><a href="#" class="nav-item" data-section="trucks"><i class="fa-solid fa-truck"></i> Trucks</a></li>
      <li><a href="#" class="nav-item" data-section="products"><i class="fa-solid fa-box"></i> Products</a></li>
      <li><a href="#" class="nav-item" data-section="orders"><i class="fa-solid fa-clipboard-list"></i> Orders</a></li>
      <li><a href="#" class="nav-item" data-section="optimizer"><i class="fa-solid fa-route"></i> Optimizer</a></li>
      <li><a href="#" class="nav-item" data-section="loading"><i class="fa-solid fa-layer-group"></i> Loading Plan</a></li>
    </ul>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content">

    <!-- DASHBOARD -->
    <section id="section-dashboard" class="app-section active">
      <div class="section-header">
        <h1><i class="fa-solid fa-gauge-high"></i> Dashboard</h1>
      </div>
      <div id="dashboard-content">
        <!-- Rendered by dashboard.js -->
        <div class="spinner-container"><div class="spinner"></div></div>
      </div>
    </section>

    <!-- CLIENTS -->
    <section id="section-clients" class="app-section">
      <div class="section-header">
        <h1><i class="fa-solid fa-building-user"></i> Clients</h1>
        <button class="btn btn-primary" id="btn-add-client">
          <i class="fa-solid fa-plus"></i> Add Client
        </button>
      </div>
      <div class="toolbar">
        <input type="text" id="client-search" placeholder="Search clients…" class="search-input" />
        <select id="client-sort" class="sort-select">
          <option value="name">Sort by Name</option>
          <option value="address">Sort by Address</option>
          <option value="createdAt">Sort by Date Added</option>
        </select>
      </div>
      <div id="clients-table-container"></div>
      <div class="map-section">
        <h2><i class="fa-solid fa-map"></i> Client Locations</h2>
        <div id="clients-map" class="map-container"></div>
      </div>
    </section>

    <!-- TRUCKS -->
    <section id="section-trucks" class="app-section">
      <div class="section-header">
        <h1><i class="fa-solid fa-truck"></i> Trucks</h1>
        <button class="btn btn-primary" id="btn-add-truck">
          <i class="fa-solid fa-plus"></i> Add Truck
        </button>
      </div>
      <div class="toolbar">
        <input type="text" id="truck-search" placeholder="Search trucks…" class="search-input" />
      </div>
      <div id="trucks-cards-container" class="cards-grid"></div>
    </section>

    <!-- PRODUCTS -->
    <section id="section-products" class="app-section">
      <div class="section-header">
        <h1><i class="fa-solid fa-box"></i> Products</h1>
        <button class="btn btn-primary" id="btn-add-product">
          <i class="fa-solid fa-plus"></i> Add Product
        </button>
      </div>
      <div class="toolbar">
        <input type="text" id="product-search" placeholder="Search products…" class="search-input" />
        <select id="product-sort" class="sort-select">
          <option value="name">Sort by Name</option>
          <option value="category">Sort by Category</option>
          <option value="unit">Sort by Unit</option>
        </select>
      </div>
      <div id="products-table-container"></div>
    </section>

    <!-- ORDERS -->
    <section id="section-orders" class="app-section">
      <div class="section-header">
        <h1><i class="fa-solid fa-clipboard-list"></i> Tour Orders</h1>
        <button class="btn btn-primary" id="btn-add-order">
          <i class="fa-solid fa-plus"></i> New Tour Order
        </button>
      </div>
      <div class="toolbar">
        <input type="text" id="order-search" placeholder="Search orders…" class="search-input" />
        <select id="order-filter-status" class="sort-select">
          <option value="">All Statuses</option>
          <option value="draft">Draft</option>
          <option value="optimized">Optimized</option>
          <option value="executed">Executed</option>
        </select>
      </div>
      <div id="orders-table-container"></div>
    </section>

    <!-- OPTIMIZER -->
    <section id="section-optimizer" class="app-section">
      <div class="section-header">
        <h1><i class="fa-solid fa-route"></i> Route Optimizer</h1>
      </div>
      <div id="optimizer-content">
        <!-- Rendered by optimizer.js -->
      </div>
    </section>

    <!-- LOADING PLAN -->
    <section id="section-loading" class="app-section">
      <div class="section-header">
        <h1><i class="fa-solid fa-layer-group"></i> Loading Plan</h1>
        <div class="header-actions">
          <select id="loading-tour-select" class="sort-select"></select>
          <button class="btn btn-secondary" id="btn-print-loading">
            <i class="fa-solid fa-print"></i> Print
          </button>
        </div>
      </div>
      <div id="loading-plan-content">
        <!-- Rendered by loading.js -->
      </div>
    </section>

  </main>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ===== MODAL ===== -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-dialog" id="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title">Modal Title</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- ===== LOADING SPINNER OVERLAY ===== -->
  <div id="spinner-overlay" class="spinner-overlay hidden">
    <div class="spinner-large"></div>
    <p id="spinner-message">Processing…</p>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <!-- Leaflet 1.9.4 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js 4.4.0 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Application modules (order matters) -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/trucks.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/map.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="sample-data.js"></script>

</body>
</html>
